<div class="min-h-screen bg-black flex items-center justify-center px-4 py-8 text-white">
  <!-- Video Card Container -->
  <div class="relative w-full max-w-md aspect-[9/16] rounded-xl overflow-hidden shadow-lg">

    <!-- Video -->
    <video
      [src]="videos[currentIndex]"
      autoplay
      muted
      loop
      playsinline
      class="absolute top-0 left-0 w-full h-full object-cover"
    ></video>

    <!-- Overlay -->
    <div class="absolute inset-0 flex flex-col justify-end p-4 bg-gradient-to-t from-black/70 via-black/30 to-transparent">

      <!-- User Info -->
      <div class="mb-4">
        <h3 class="text-lg font-semibold">daly</h3>
        <p class="text-sm">Une délicieuse vidéo food 🍝</p>
        <span class="text-xs text-gray-300">🎵 Audio original</span>
      </div>

      <!-- Actions -->
      <div class="absolute right-4 bottom-24 flex flex-col items-center space-y-3">
        <button class="flex flex-col items-center">
          <i class="fa-solid fa-heart text-2xl hover:text-red-500 transition"></i>
          <span class="text-xs mt-1">3.2k</span>
        </button>
        <button class="flex flex-col items-center">
          <i class="fa-solid fa-comment-dots text-2xl hover:text-blue-400 transition"></i>
          <span class="text-xs mt-1">128</span>
        </button>
        <button class="flex flex-col items-center">
          <i class="fa-solid fa-share text-2xl hover:text-green-400 transition"></i>
          <span class="text-xs mt-1">72</span>
        </button>
      </div>
    </div>
  </div>
</div>
